# Node version specified in .node-version file (Node 24 required for Prisma 7)
[build]
builder = "nixpacks"
buildCommand = "npm install && npm run prisma:generate && npm run build"

[deploy]
startCommand = "npm run start"
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3

[variables]
CORS_ORIGIN = "https://gym-pwa-321.netlify.app"
