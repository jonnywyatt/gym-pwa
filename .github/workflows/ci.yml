# CI workflow
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    name: Test and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: |
          cd api
          rm -rf src/prisma-client
          npm run prisma:generate
        env:
          DATABASE_URL: postgresql://postgres:localdev@localhost:5432/gym_test

      - name: Clean postgres container and volumes
        run: |
          docker rm -f gym-postgres 2>/dev/null || true
          docker volume rm api_gym-postgres-data 2>/dev/null || true

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Start docker and setup database
        run: |
          cd api
          npm run docker:start
          npm run db:test:reset
          echo "Checking database state..."
          docker exec gym-postgres psql -U postgres -d gym_test -c "SELECT COUNT(*) FROM exercises;"
          docker exec gym-postgres psql -U postgres -d gym_test -c "SELECT COUNT(*) FROM exercise_primary_muscle_groups;"
          docker exec gym-postgres psql -U postgres -d gym_test -c "SELECT e.label, COUNT(epmg.muscle_group_id) as muscle_groups FROM exercises e LEFT JOIN exercise_primary_muscle_groups epmg ON e.id = epmg.exercise_id WHERE e.label = 'Pull up (assisted)' GROUP BY e.label;"

      - name: Verify Prisma client can query data (CommonJS)
        run: cd api && node verify-db.js

      - name: Verify Prisma client can query data (TypeScript)
        run: cd api && npx tsx verify-db.ts

      - name: Run tests
        run: npm run test -w api -- run && npm run test:run -w pwa
        env:
          DATABASE_URL: postgresql://postgres:localdev@localhost:5432/gym_test

      - name: Build API
        run: npm run build:api

      - name: Build PWA
        run: npm run build
