pre-commit:
  commands:
    audit:
      run: npm audit --audit-level=critical
      fail_text: "npm audit found critical vulnerabilities. Run 'npm audit' for details."
    format:
      glob: "**/*.{js,ts,cjs,mjs,d.cts,d.mts,jsx,tsx,json,jsonc}"
      run: npx @biomejs/biome check --write --no-errors-on-unmatched --files-ignore-unknown=true --colors=off {staged_files}
      stage_fixed: true
    lint:
      glob: "**/*.{js,ts,cjs,mjs,d.cts,d.mts,jsx,tsx,json,jsonc}"
      run: npx @biomejs/biome check --error-on-warnings --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
      fail_text: "Biome lint check failed. Fix the errors above and try again."
    typecheck-pwa:
      glob: "pwa/**/*.{ts,vue}"
      run: npm run type-check:pwa
    typecheck-api:
      glob: "api/**/*.ts"
      run: npm run type-check:api
    test-pwa:
      glob: "pwa/**/*.{ts,vue}"
      run: npm run test:run -w pwa
      interactive: true
    test-api:
      glob: "api/**/*.ts"
      run: npm run test:run -w api
      interactive: true
