[build]
  command = "rm -rf node_modules pwa/node_modules api/node_modules package-lock.json && npm install && npm run build"
  publish = "pwa/dist"

[build.environment]
  NODE_VERSION = "20"

# SPA routing - redirect all routes to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
